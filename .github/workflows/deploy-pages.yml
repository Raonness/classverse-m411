name: Deploy ClassVerse to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Automatically update ClassVerse version
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'assets/data/version.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (data.sourceCommit === process.env.SOURCE_COMMIT) {
            console.log('Version already recorded for this source commit.');
            process.exit(0);
          }
          const parts = String(data.version || '1.0.0.0.0').split('.').map(Number);
          while (parts.length < 5) parts.push(0);
          parts[4] = (parts[4] || 0) + 1;
          const version = parts.slice(0, 5).join('.');
          const date = new Date().toISOString().slice(0, 10);
          const { execFileSync } = require('node:child_process');
          const sourceCommit = process.env.SOURCE_COMMIT;
          const subject = execFileSync('git', ['log', '-1', '--format=%s', sourceCommit], { encoding: 'utf8' }).trim();
          const previousCommit = data.sourceCommit;
          let changedFiles = [];
          if (previousCommit && previousCommit !== sourceCommit) {
            try {
              changedFiles = execFileSync('git', ['diff', '--name-only', previousCommit, sourceCommit], { encoding: 'utf8' })
                .split('\n').map(file => file.trim()).filter(Boolean);
            } catch (error) {
              console.log('Could not compare source commits; using commit subject only.');
            }
          }
          const areas = [
            { test: /customize\/(images|video-images|pdf-images)/, label: 'ระบบเลือกรูปภาพและแปลงไฟล์' },
            { test: /customize\//, label: 'เครื่องมือปรับแต่งไฟล์' },
            { test: /assets\/(css|js)\//, label: 'หน้าตาและการทำงานของเว็บไซต์' },
            { test: /updates\//, label: 'หน้าประวัติการอัปเดต' },
            { test: /assets\/data\/version\.json/, label: 'ระบบเวอร์ชันและประวัติการอัปเดต' },
            { test: /(^|\/)index\.html$|pages?\//, label: 'หน้าเว็บไซต์และเนื้อหา' },
            { test: /\.github\/workflows\//, label: 'ระบบเผยแพร่และอัตโนมัติ' }
          ];
          const detectedAreas = [...new Set(areas.filter(area => changedFiles.some(file => area.test.test(file))).map(area => area.label))];
          const title = detectedAreas.length
            ? 'ปรับปรุง' + detectedAreas.slice(0, 2).join(' และ ')
            : (/^[\u0E00-\u0E7F]/.test(subject) ? subject : 'ปรับปรุงระบบ ClassVerse');
          const details = [
            ...(detectedAreas.length ? detectedAreas.map(area => 'ปรับปรุง' + area) : ['อัปเดตเว็บไซต์: ' + (subject || 'ปรับปรุงระบบ ClassVerse')]),
            ...(changedFiles.length ? ['อัปเดตไฟล์ที่เกี่ยวข้อง ' + changedFiles.length + ' ไฟล์'] : []),
            'ปรับเลขเวอร์ชันและบันทึกประวัติการเผยแพร่อัตโนมัติ',
            'เผยแพร่ผ่าน GitHub Actions'
          ];
          data.version = version;
          data.releaseType = 'Minor';
          data.updatedAt = date;
          data.title = title;
          data.summary = 'อัปเดต ClassVerse อัตโนมัติจากการเผยแพร่ครั้งล่าสุด: ' + title;
          data.sourceCommit = process.env.SOURCE_COMMIT;
          data.history = [{
            version,
            type: 'Minor',
            date,
            title,
            details
          }, ...(data.history || [])].slice(0, 100);
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          console.log('Prepared ClassVerse version ' + version);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(version): update release metadata [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
